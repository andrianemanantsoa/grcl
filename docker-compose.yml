version: '3.8'
services:
  mongodb:
    image: mongo:6-jammy
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  auth-service:
    build: ./services/auth-service
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/crowdauth
      - JWT_SECRET=supersecret
    depends_on:
      - mongodb

  frontend:
    build: ./services/frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - auth-service

volumes:
  mongo-data:
